name: Release

on:
  push:
    tags:
      - 'release/*'

permissions:
  contents: write

jobs:
  build-converter:
    name: Build converter (windows-${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            py_arch: x64
          - arch: x86
            py_arch: x86
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set build variables
        shell: bash
        run: |
          GIT_TAG="${GITHUB_REF_NAME}"
          GIT_VER="${GIT_TAG#release/}"
          if [[ $GIT_VER =~ ^[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9]+$ ]]; then
            GH_TYPE='Release Candidate'
          else
            GH_TYPE='Release'
          fi
          echo "GIT_VER=$GIT_VER" >> $GITHUB_ENV
          echo "GIT_TAG=$GIT_TAG" >> $GITHUB_ENV
          echo "GH_TYPE=$GH_TYPE" >> $GITHUB_ENV
          echo "ARCH_NAME=${{ matrix.arch }}" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.py_arch }}
          cache: 'pip'
          cache-dependency-path: src/requirements_converter.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/requirements_converter.txt pyinstaller

      - name: Generate version info
        run: python src/gen_version_info.py
        env:
          CONVERTER_VERSION: ${{ env.GIT_VER }}

      - name: Build converter
        working-directory: src
        run: |
          python -m PyInstaller --onefile --noupx converter_gui.py --name rotorflight-to-wingflight --windowed --uac-admin --version-file version_info.txt --icon icon.ico --add-data "drivers;drivers" --add-data "tools;tools" --add-data "logo.png;."

      - name: Package converter
        shell: pwsh
        run: |
          $artName = "rotorflight-to-wingflight-$env:GIT_VER-windows-$env:ARCH_NAME.zip"
          $artPath = "dist\$artName"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "src\dist\rotorflight-to-wingflight.exe" -DestinationPath $artPath -Force
          "ART_NAME=$artName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ART_PATH=$artPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload converter artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ART_NAME }}
          path: ${{ env.ART_PATH }}
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-converter]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set build variables
        shell: bash
        run: |
          GIT_TAG="${GITHUB_REF_NAME}"
          GIT_VER="${GIT_TAG#release/}"
          if [[ $GIT_VER =~ ^[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9]+$ ]]; then
            GH_TYPE='Release Candidate'
          else
            GH_TYPE='Release'
          fi
          echo "GIT_VER=$GIT_VER" >> $GITHUB_ENV
          echo "GIT_TAG=$GIT_TAG" >> $GITHUB_ENV
          echo "GH_TYPE=$GH_TYPE" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: Create release notes
        run: |
          python .github/scripts/extract-release-notes.py "${{ env.GIT_VER }}" Releases.md > Notes.md
          sed -n '1,200p' Notes.md

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd dist
          gh release create "${{ env.GIT_TAG }}" --notes-file ../Notes.md -t "Rotorflight to Wingflight - ${{ env.GH_TYPE }} ${{ env.GIT_VER }}" *.zip
